                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    if (className) i.setAttribute('class', className);
                    ref.current.appendChild(i);
                    window.lucide.createIcons({ root: ref.current });
                }
            }, [name, className]);
            return <span ref={ref} style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}></span>;
        };

        function CustomDropdown({ value, onChange, options, customClasses }) { 
            const [isOpen, setIsOpen] = useState(false); 
            const dropdownRef = useRef(null); 
            
            useEffect(() => { 
                const handleClickOutside = (event) => { 
                    if (dropdownRef.current && !dropdownRef.current.contains(event.target)) { setIsOpen(false); } 
                }; 
                document.addEventListener('mousedown', handleClickOutside); 
                return () => document.removeEventListener('mousedown', handleClickOutside); 
            }, []); 
            
            const selectedOption = options.find(o => o.value === value);
            const selectedLabel = selectedOption?.label || '排序'; 
            
            return ( 
                <div className="relative" ref={dropdownRef}> 
                    <button type="button" onClick={() => setIsOpen(!isOpen)} className={customClasses || "flex items-center gap-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-900 font-bold hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm active:scale-95"}>

        const formatCountdown = (ms) => { const totalSeconds = Math.floor(ms / 1000); const hours = Math.floor(totalSeconds / 3600); const minutes = Math.floor((totalSeconds % 3600) / 60); const seconds = totalSeconds % 60; return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`; };

        const formatTimeStr = (date) => { 
            try {
                if (!(date instanceof Date) || isNaN(date.getTime())) return '--:--';
                return date.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' }); 
            } catch(e) { return '--:--'; }
        };

        const formatRelativeTime = (lastSeen) => {
            if (!lastSeen || typeof lastSeen.toDate !== 'function') return '無紀錄';
            const date = lastSeen.toDate();
            const now = new Date();
            const diffMs = now - date;
            const diffSec = Math.floor(diffMs / 1000);
            const diffMin = Math.floor(diffSec / 60);
            const diffHour = Math.floor(diffMin / 60);
            const diffDay = Math.floor(diffHour / 24);

            if (diffSec < 60) return '剛剛';
            if (diffMin < 60) return `${diffMin} 分鐘前`;
            if (diffHour < 24) return `${diffHour} 小時前`;
            if (diffDay < 30) return `${diffDay} 天前`;
            return date.toLocaleDateString('zh-HK');
        };

        const formatDueDate = (dateStr) => {
            if (!dateStr) return '';
            if (typeof dateStr !== 'string') {
                if (dateStr.toDate && typeof dateStr.toDate === 'function') {
                    const d = dateStr.toDate();
                    const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                    const dateString = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    return `${dateString} (星期${weekDays[d.getDay()]})`;
                }
                return String(dateStr); 
            }
            try {
                const d = new Date(dateStr);
                if (isNaN(d.getTime())) return String(dateStr); 
                const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
                return `${dateStr} (星期${weekDays[d.getDay()]})`;
            } catch (e) {
                return String(dateStr);

            const daySubjects = config.schedule?.[day] || [];

            const baseDate = new Date(now); baseDate.setHours(0,0,0,0);

            return config.timeSlots.map(slot => {
                const timeStr = slot.startTime || "00:00";
                const parts = timeStr.split(':');
                const h = parseInt(parts[0]) || 0;
                const m = parseInt(parts[1]) || 0;

                const start = new Date(baseDate); start.setHours(h, m, 0, 0);

        // ====== 輔助模態框與子組件 ======
        function CurrentLessonWidget({ config, t, onClick, globalNow }) {
            const now = globalNow || new Date();
            const day = now.getDay();
            if (day === 0 || day === 6) return <div className="bg-white/60 dark:bg-slate-800/60 backdrop-blur-xl rounded-2xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 mb-6 text-center"><div className="font-bold text-slate-500 dark:text-slate-400 flex items-center justify-center gap-2"><Icon name="coffee" className="w-5 h-5 text-orange-500"/> 放假啦！好好休息</div></div>;

            const schedule = generateFullSchedule(config, now);
            const currentMs = now.getTime();
            
            let currentSlot = null;
            let nextSlot = null;
            let status = 'ended';

            for (let i = 0; i < schedule.length; i++) {
                const s = schedule[i];
                if (currentMs >= s.start.getTime() && currentMs < s.end.getTime()) {
                    currentSlot = s;
                    status = s.type === 'lesson' ? 'current' : 'break';
                    nextSlot = schedule[i+1];
                    break;
                }
                if (currentMs < s.start.getTime()) {
                    nextSlot = s;
                    status = 'not-started';
                    break;
                }
            }

            if (!currentSlot && !nextSlot) status = 'ended';
            const diff = currentSlot ? (currentSlot.end.getTime() - currentMs) : (nextSlot ? (nextSlot.start.getTime() - currentMs) : 0);

            return (
                <div onClick={onClick} className="cursor-pointer mb-6 relative overflow-hidden rounded-2xl p-[2px] shadow-lg hover:scale-[1.01] transition-transform duration-300">
                    <div className="absolute inset-0 bg-gradient-to-r from-violet-500 via-fuchsia-500 to-cyan-500 animate-gradient-x"></div>
                    <div className="relative bg-white/95 dark:bg-slate-900/95 backdrop-blur-3xl rounded-2xl p-4 flex items-center justify-between h-full">
                        <div className="absolute top-0 left-0 h-[2px] bg-gradient-to-r from-violet-500 to-cyan-500 opacity-50 w-full"></div>
                        <div className={`absolute top-0 left-0 h-[2px] transition-all duration-1000 ${status === 'current' ? 'bg-fuchsia-500 shadow-[0_0_10px_rgba(217,70,239,0.8)]' : 'bg-transparent'}`} style={{ width: currentSlot ? `${100 - (diff / (currentSlot.end - currentSlot.start)) * 100}%` : '0%' }}></div>

                        <div className="flex-1 text-left min-w-0 z-10">
                            <div className="text-[10px] text-slate-500 dark:text-slate-400 font-bold uppercase mb-0.5 flex items-center gap-1">
                                {status === 'current' ? <span className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> : <Icon name="clock" className="w-3 h-3"/>}
                                {status === 'current' ? '正在上課' : status === 'break' ? '小息時間' : status === 'not-started' ? '準備上課' : '放學'}
                            </div>
                            <div className="font-black text-xl text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-300 truncate">
                                {status === 'ended' ? '🎉 是日已完結' : (currentSlot ? currentSlot.subjectName : '---')}
                            </div>
                        </div>

                        {(status !== 'ended') && (
                            <div className="flex-1 text-center z-10">
                                <div className={`text-3xl font-black font-mono tracking-tighter text-transparent bg-clip-text bg-gradient-to-br ${status === 'current' ? 'from-violet-600 to-fuchsia-600 dark:from-violet-400 dark:to-fuchsia-400' : 'from-slate-400 to-slate-600'}`}>
                                    {formatCountdown(diff)}
                                </div>
                                <div className="text-[9px] text-slate-400 font-bold tracking-widest uppercase">
                                    {status === 'current' ? 'REMAINING' : 'NEXT LESSON'}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 text-right min-w-0 pl-2 z-10">
                            <div className="text-[10px] text-slate-400 font-bold uppercase mb-0.5">下一節</div>
                            <div className="font-bold text-sm text-slate-600 dark:text-slate-300 truncate">
                                {nextSlot ? nextSlot.subjectName : '放學'}
                            </div>
                        </div>
                        <Icon name="sparkles" className="absolute -bottom-2 -right-2 w-12 h-12 text-fuchsia-500/10 animate-float pointer-events-none" />
                    </div>

        function SubjectSelectionModal({ onClose, onSelect, subjects }) {
            return (
                <div className="fixed inset-0 z-[160] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="modal-animate bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-2xl p-6 relative z-10 flex flex-col max-h-[80vh]">

                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 overflow-y-auto p-1">

                            {subjects.map(sub => (
                                <button key={sub.name} onClick={() => onSelect(sub.name)} className={`p-4 rounded-2xl border-2 font-bold shadow-sm hover:scale-[1.02] flex flex-col items-center justify-center gap-2 min-h-[80px] ${sub.color}`}><span className="text-lg">{sub.name}</span></button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        function SubjectManagerModal({ isOpen, onClose, currentSubjects, onSave, triggerConfirm }) {
            const [newSubjectName, setNewSubjectName] = useState('');
            const [newSubjectColor, setNewSubjectColor] = useState(COLOR_PALETTE[0].value);
            const [tempSubjects, setTempSubjects] = useState([]);

            useEffect(() => { if (isOpen) setTempSubjects(currentSubjects); }, [isOpen, currentSubjects]);
            if (!isOpen) return null;

            const handleAdd = (e) => {
                e.preventDefault(); if (!newSubjectName.trim()) return;
                if (tempSubjects.some(s => s.name === newSubjectName.trim())) { alert("科目名稱重複"); return; }
                setTempSubjects([...tempSubjects, { name: newSubjectName.trim(), color: newSubjectColor }]); setNewSubjectName('');
            };
            const handleDelete = (name) => { triggerConfirm(`確定要刪除「${name}」嗎？`, () => setTempSubjects(tempSubjects.filter(s => s.name !== name))); };
            const moveSubject = (index, direction) => {
                const newSubjects = [...tempSubjects];
                if (direction === 'up' && index > 0) { [newSubjects[index], newSubjects[index - 1]] = [newSubjects[index - 1], newSubjects[index]]; } 
                else if (direction === 'down' && index < newSubjects.length - 1) { [newSubjects[index], newSubjects[index + 1]] = [newSubjects[index + 1], newSubjects[index]]; }
                setTempSubjects(newSubjects);
            };

            const handleAISort = () => {
                const priority = ['中文', '英文', '數學', '常識', '通識', '公社', '物理', '化學', '生物'];
                const sorted = [...tempSubjects].sort((a, b) => {
                    const idxA = priority.indexOf(a.name); const idxB = priority.indexOf(b.name);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.name.localeCompare(b.name);
                });
                setTempSubjects(sorted);
            };

            return (
                <div className="fixed inset-0 z-[150] flex items-center justify-center p-4">
                    <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="modal-animate bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-xl p-6 relative z-10 flex flex-col max-h-[85vh]">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="text-xl font-bold text-slate-800 dark:text-white">科目設定</h3>
                            <button onClick={onClose} className="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-full transition-colors"><Icon name="x" className="w-5 h-5 text-slate-500" /></button>
                        </div>
                        <div className="flex-1 overflow-y-auto pr-1">
                            <div className="flex justify-between items-center mb-3">
                                <span className="text-xs font-bold text-slate-500">科目列表</span>
                                <button onClick={handleAISort} className="text-xs font-bold bg-gradient-to-r from-indigo-500 to-purple-500 text-white px-3 py-1.5 rounded-lg shadow-md active:scale-95 flex items-center gap-1"><Icon name="sparkles" className="w-3 h-3" /> AI 智能排序</button>
                            </div>
                            <form onSubmit={handleAdd} className="bg-slate-50 dark:bg-slate-900/50 p-4 rounded-xl border border-slate-100 dark:border-slate-700 mb-4">
                                <label className="block text-xs font-bold text-slate-500 mb-2">新增科目</label>
                                <div className="flex gap-2 mb-2"><input type="text" value={newSubjectName} onChange={e => setNewSubjectName(e.target.value)} className="flex-1 px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-white text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="科目名稱 (例如: 數學)" required /></div>
                                <div className="grid grid-cols-5 gap-2 max-h-32 overflow-y-auto pr-1 pb-1">
                                    {COLOR_PALETTE.map((c, i) => (<button key={i} type="button" onClick={() => setNewSubjectColor(c.value)} className={`h-8 rounded-lg border-2 ${c.value} ${newSubjectColor === c.value ? 'ring-2 ring-offset-1 ring-slate-400 border-transparent' : 'border-transparent opacity-60 hover:opacity-100'}`} />))}
                                </div>
                                <button type="submit" className="w-full mt-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700">新增</button>
                            </form>
                            <div className="space-y-2">
                                {tempSubjects.map((sub, index) => (
                                    <div key={sub.name + index} className="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm group">
                                        <span className={`px-2 py-1 rounded text-xs font-bold border ${sub.color}`}>{sub.name}</span>
                                        <div className="flex items-center gap-1">
                                            <button type="button" onClick={() => moveSubject(index, 'up')} disabled={index === 0} className="p-1.5 text-slate-400 hover:text-indigo-600 disabled:opacity-20 hover:bg-slate-100 rounded-lg"><Icon name="arrow-up" className="w-3.5 h-3.5" /></button>
                                            <button type="button" onClick={() => moveSubject(index, 'down')} disabled={index === tempSubjects.length - 1} className="p-1.5 text-slate-400 hover:text-indigo-600 disabled:opacity-20 hover:bg-slate-100 rounded-lg"><Icon name="arrow-down" className="w-3.5 h-3.5" /></button>
                                            <div className="w-px h-4 bg-slate-200 mx-1"></div>
                                            <button onClick={() => handleDelete(sub.name)} className="text-slate-400 hover:text-red-500 p-1"><Icon name="trash-2" className="w-4 h-4" /></button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700 flex gap-3">
                            <button onClick={() => { triggerConfirm("確定重置為預設科目？", () => { onSave(DEFAULT_SUBJECTS); onClose(); }); }} className="px-4 py-2 text-slate-500 hover:text-slate-700 font-bold text-sm">重置預設</button>
                            <button onClick={() => { onSave(tempSubjects); onClose(); }} className="flex-1 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700">儲存變更</button>
                        </div>
                    </div>
                </div>
            );
        }

        function SlotTypeSelector({ value, onChange }) {
            const types = [ { id: 'lesson', label: '課堂', icon: 'book-open' }, { id: 'break', label: '小息', icon: 'coffee' }, { id: 'lunch', label: '午膳', icon: 'utensils' } ];
            return (
                <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                    {types.map(t => (
                        <button key={t.id} onClick={() => onChange(t.id)} className={`flex-1 flex items-center justify-center gap-1.5 py-1.5 px-2 rounded-lg text-xs font-bold transition-all ${value === t.id ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500'}`}><Icon name={t.icon} className="w-3 h-3" /> {t.label}</button>
                    ))}
                </div>
            );
        }

        function TimetableEditor({ initialConfig, onSave, onCancel, subjects, triggerConfirm }) {
            const [activeTab, setActiveTab] = useState('slots'); 
            const [timeSlots, setTimeSlots] = useState(initialConfig?.timeSlots || [...DEFAULT_TIME_SLOTS]);
            const [schedule, setSchedule] = useState(initialConfig?.schedule || { ...DEFAULT_SCHEDULE });
            const [editDay, setEditDay] = useState(1); 
            const [editingCell, setEditingCell] = useState(null); 

            const handleSlotChange = (index, field, value) => { const newSlots = [...timeSlots]; newSlots[index] = { ...newSlots[index], [field]: value }; setTimeSlots(newSlots); };
            const addSlot = () => setTimeSlots([...timeSlots, { id: 's' + Date.now(), label: '新課節', type: 'lesson', startTime: '08:00', duration: 35 }]);
            const removeSlot = (index) => setTimeSlots(timeSlots.filter((_, i) => i !== index));
            const moveSlot = (index, direction) => {
                const newSlots = [...timeSlots];
                if (direction === 'up' && index > 0) { [newSlots[index], newSlots[index - 1]] = [newSlots[index - 1], newSlots[index]]; } 
                else if (direction === 'down' && index < newSlots.length - 1) { [newSlots[index], newSlots[index + 1]] = [newSlots[index + 1], newSlots[index]]; }
                setTimeSlots(newSlots);
            };

            const handleSubjectSelect = (subjectName) => {
                if (editingCell) {
                    const { day, lessonIndex } = editingCell; const newSchedule = { ...schedule };
                    if (!newSchedule[day]) newSchedule[day] = [];
                    while (newSchedule[day].length <= lessonIndex) newSchedule[day].push("");
                    newSchedule[day][lessonIndex] = subjectName;
                    setSchedule(newSchedule); setEditingCell(null); 
                }
            };
            const lessonSlots = timeSlots.map((s, i) => ({ ...s, originalIndex: i })).filter(s => s.type === 'lesson');

            return (
                <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden flex flex-col h-[80vh] max-w-4xl mx-auto relative z-10">
                    <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                        <h2 className="text-lg font-bold text-slate-800 dark:text-white flex items-center gap-2"><Icon name="edit" className="w-5 h-5 text-indigo-500"/> 編輯時間表</h2>
                        <div className="flex gap-2">
                            <button onClick={() => { triggerConfirm("確定要重置為預設時間表嗎？", () => { setTimeSlots([...DEFAULT_TIME_SLOTS]); setSchedule({ ...DEFAULT_SCHEDULE }); }); }} className="px-3 py-1.5 text-xs font-bold text-slate-500 hover:bg-slate-100 rounded-lg">重置預設</button>
                            <button onClick={onCancel} className="p-2 hover:bg-slate-100 rounded-full text-slate-400"><Icon name="x" className="w-5 h-5"/></button>
                        </div>
                    </div>

                    <div className="flex border-b border-slate-100">
                        <button onClick={() => setActiveTab('slots')} className={`flex-1 py-3 text-sm font-bold ${activeTab === 'slots' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>時間設定</button>
                        <button onClick={() => setActiveTab('schedule')} className={`flex-1 py-3 text-sm font-bold ${activeTab === 'schedule' ? 'text-indigo-600 border-b-2 border-indigo-600 bg-indigo-50/50' : 'text-slate-500 hover:bg-slate-50'}`}>課程編排</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 bg-slate-50 dark:bg-slate-900/50">
                        {activeTab === 'slots' ? (
                            <div className="space-y-3">
                                {timeSlots.map((slot, index) => (
                                    <div key={index} className="flex flex-wrap items-center gap-2 bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 shadow-sm">
                                        <div className="flex flex-col gap-1 mr-2">
                                            <button onClick={() => moveSlot(index, 'up')} disabled={index === 0} className="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 active:scale-90"><Icon name="chevron-up" className="w-4 h-4"/></button>
                                            <button onClick={() => moveSlot(index, 'down')} disabled={index === timeSlots.length - 1} className="p-1 text-slate-400 hover:text-indigo-600 disabled:opacity-20 active:scale-90"><Icon name="chevron-down" className="w-4 h-4"/></button>
                                        </div>
                                        <input type="time" value={slot.startTime} onChange={(e) => handleSlotChange(index, 'startTime', e.target.value)} className="w-24 p-2 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 outline-none focus:ring-2 focus:ring-indigo-500" />
                                        <div className="flex items-center gap-1 bg-slate-100 px-2 rounded-lg border border-slate-200">
                                            <input type="number" value={slot.duration} onChange={(e) => handleSlotChange(index, 'duration', parseInt(e.target.value) || 0)} className="w-12 p-2 bg-transparent text-sm text-center outline-none text-slate-800" /><span className="text-xs text-slate-500 pr-1">分</span>
                                        </div>
                                        <div className="min-w-[180px]"><SlotTypeSelector value={slot.type} onChange={(val) => handleSlotChange(index, 'type', val)} /></div>
                                        <input type="text" value={slot.label} onChange={(e) => handleSlotChange(index, 'label', e.target.value)} className="flex-1 min-w-[100px] p-2 rounded-lg border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="標籤" />
                                        <button onClick={() => removeSlot(index)} className="p-2 text-slate-400 hover:text-red-500 rounded-lg"><Icon name="trash-2" className="w-4 h-4"/></button>
                                    </div>
                                ))}
                                <button onClick={addSlot} className="w-full py-3 border-2 border-dashed border-indigo-200 text-indigo-500 rounded-xl font-bold hover:bg-indigo-50 flex items-center justify-center gap-2"><Icon name="plus" className="w-4 h-4" /> 新增時間段</button>
                            </div>
                        ) : (
                            <div className="space-y-4">
                                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                    {['一','二','三','四','五'].map((d, i) => (
                                        <button key={i} onClick={() => setEditDay(i + 1)} className={`px-4 py-2 rounded-lg font-bold text-sm whitespace-nowrap ${editDay === i + 1 ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>星期{d}</button>
                                    ))}
                                </div>
                                <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                                    <h3 className="font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-2"><span className="w-2 h-6 bg-indigo-500 rounded-full"></span>星期{['日','一','二','三','四','五','六'][editDay]} 課程</h3>
                                    {lessonSlots.length === 0 ? <p className="text-slate-400 text-center py-4">請先在「時間設定」新增課堂類型的時間段</p> : 
                                    lessonSlots.map((slot, lessonIdx) => {
                                        const currentSubjectName = schedule[editDay]?.[lessonIdx];
                                        const subObj = subjects.find(s => s.name === currentSubjectName);
                                        const colorClass = subObj ? subObj.color : 'bg-slate-100 text-slate-400 border-slate-200';
                                        return (
                                            <div key={lessonIdx} className="flex items-center gap-3">
                                                <div className="w-20 text-xs font-bold text-slate-500 text-right">{slot.label}</div>
                                                <div className="flex-1">
                                                    <button onClick={() => setEditingCell({ day: editDay, lessonIndex: lessonIdx })} className={`w-full p-3 rounded-xl border-2 text-left font-bold transition-all hover:brightness-95 flex justify-between items-center ${currentSubjectName ? colorClass : 'bg-slate-50 border-slate-200 text-slate-400'}`}>
                                                        <span>{currentSubjectName || '(空堂)'}</span><Icon name="chevron-right" className="w-4 h-4 opacity-50" />
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="p-4 border-t border-slate-100 bg-white dark:bg-slate-800">
                        <button onClick={() => onSave({ timeSlots, schedule })} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 active:scale-95 flex items-center justify-center gap-2"><Icon name="save" className="w-4 h-4" /> 儲存設定</button>
                    </div>

                    {editingCell && <SubjectSelectionModal onClose={() => setEditingCell(null)} onSelect={handleSubjectSelect} subjects={subjects} />}
                </div>
            );
        }

        function Timetable({ currentDay, config, onDayChange, subjects, globalNow }) { 
            const weekDays = ['日', '一', '二', '三', '四', '五', '六']; 
            const now = globalNow || new Date();
            const scheduleData = generateFullSchedule(config, now, currentDay); 
            return ( 
                <div className="space-y-4"> 
                    <div className="flex bg-white dark:bg-slate-800 rounded-xl p-1 shadow-sm overflow-x-auto">{[1, 2, 3, 4, 5].map(day => (<button key={day} onClick={() => onDayChange(day)} className={`flex-1 py-2 px-3 rounded-lg text-sm font-bold whitespace-nowrap ${currentDay === day ? 'bg-indigo-600 text-white shadow' : 'text-slate-500 hover:bg-slate-50'}`}>星期{weekDays[day]}</button>))}</div> 
                    <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 p-4">
                        {scheduleData.length > 0 ? scheduleData.map((slot, idx) => { 
                            const nowTime = now.getTime(); const startTime = slot.start.getTime(); const endTime = slot.end.getTime();
                            let status = 'future'; let diff = 0;
                            if (nowTime > endTime) { status = 'past'; } else if (nowTime >= startTime && nowTime <= endTime) { status = 'current'; diff = endTime - nowTime; }
                            return (
                                <div key={idx} className={`relative pl-6 pb-6 last:pb-0 border-l-2 ${status === 'current' ? 'border-purple-500' : (status === 'past' ? 'border-slate-200' : 'border-green-300')}`}>
                                    <div className={`absolute -left-[9px] top-0 w-4 h-4 rounded-full border-2 ${status === 'current' ? 'bg-purple-500 border-purple-100 animate-pulse scale-110' : (status === 'past' ? 'bg-slate-200 border-slate-100' : 'bg-white border-green-400')}`}></div>
                                    <div className={`rounded-xl p-3 ${status === 'current' ? 'bg-purple-50 shadow-md border border-purple-100 transform scale-[1.02]' : (status === 'past' ? 'opacity-60 grayscale' : 'bg-green-50/50 border border-green-100')}`}>
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <div className={`text-xs font-mono mb-0.5 ${status === 'current' ? 'text-purple-600 font-bold' : 'text-slate-400'}`}>{formatTimeStr(slot.start)} - {formatTimeStr(slot.end)}</div>
                                                <div className={`text-base font-bold ${slot.type === 'lesson' ? 'text-slate-800' : 'text-slate-500 italic'} ${status === 'current' ? 'text-purple-900' : ''}`}>{slot.subjectName}</div>
                                            </div>
                                            {status === 'current' && (<div className="text-right"><span className="inline-block text-[10px] bg-purple-600 text-white px-2 py-0.5 rounded-full font-bold mb-1 animate-pulse">進行中</span><div className="text-xs font-mono font-bold text-purple-600">剩 {formatCountdown(diff)}</div></div>)}
                                            {status === 'past' && <Icon name="check-circle" className="w-4 h-4 text-slate-300" />}
                                        </div>
                                    </div>
                                </div>
                            ); 
                        }) : (<div className="text-center py-10 text-slate-400">是日休息或未設定課程</div>)}
                    </div> 
                </div> 
            ); 
        }

        function AdminConsole({ db, systemConfig, systemClasses, onBack, subjects, triggerAlert, triggerConfirm }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [users, setUsers] = useState([]);
            const [publicTasks, setPublicTasks] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedUser, setSelectedUser] = useState(null);
            const [userHomeworks, setUserHomeworks] = useState([]);
            
            const [newEmail, setNewEmail] = useState('');
            const [newBlacklistEmail, setNewBlacklistEmail] = useState('');
            const [newClassName, setNewClassName] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [newName, setNewName] = useState('');
            const [editingAdminItem, setEditingAdminItem] = useState(null);
            const [isScanning, setIsScanning] = useState(false);
            const [expiredReport, setExpiredReport] = useState(null);

            const { collection, getDocs, query, orderBy, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove, deleteDoc, setDoc, getDoc, writeBatch, limit } = window.firebaseServices || {};
            const allowedEmails = systemConfig?.allowedEmails || [];
            const blacklistedEmails = systemConfig?.blacklistedEmails || [];

            useEffect(() => {
                if (!db || !collection) return;
                const q = query(collection(db, "users_public"), orderBy("lastSeen", "desc"), limit(300));
                const unsubscribe = onSnapshot(q, (snapshot) => setUsers(snapshot.docs.map(d => ({ uid: d.id, ...d.data() }))), (err) => console.warn("Admin users err:", err));
                return () => unsubscribe();
            }, [db, collection]);

            useEffect(() => {
                if (!db || !collection) return;
                const q = query(collection(db, "public_assignments"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, (snapshot) => setPublicTasks(snapshot.docs.map(d => ({ id: d.id, ...d.data() }))), (err) => console.warn("Admin tasks err:", err));
                return () => unsubscribe();
            }, [db, collection]);

            useEffect(() => {
                if (!selectedUser || !db || !collection) return;
                const q = query(collection(db, "users", selectedUser.uid, "items"), orderBy("dueDate", "asc"));
                const unsubscribe = onSnapshot(q, (snapshot) => setUserHomeworks(snapshot.docs.map(d => ({ id: d.id, ...d.data() }))), (err) => console.warn("Admin user items err:", err));
                setNewName(selectedUser.displayName || '');
                return () => unsubscribe();
            }, [selectedUser, db, collection]);

            const updateConfig = async (key, value) => { try { await setDoc(doc(db, "system_settings", "config"), { [key]: value }, { merge: true }); triggerAlert("設定已更新"); } catch (e) { triggerAlert("設定更新失敗"); } };
            
            const handleAddWhitelist = async (e) => { e.preventDefault(); if (!newEmail.trim()) return; setIsSubmitting(true); try { await updateDoc(doc(db, "system_settings", "config"), { allowedEmails: arrayUnion(newEmail.trim()) }); setNewEmail(''); triggerAlert("已新增至白名單"); } catch (e) { triggerAlert("新增失敗"); } setIsSubmitting(false); };
            const handleRemoveWhitelist = async (email) => { triggerConfirm(`確定要移除白名單 ${email} 嗎？`, async () => { try { await updateDoc(doc(db, "system_settings", "config"), { allowedEmails: arrayRemove(email) }); triggerAlert("已移除"); } catch (e) { } }); };

            const handleAddBlacklist = async (e) => { e.preventDefault(); if (!newBlacklistEmail.trim()) return; setIsSubmitting(true); try { await updateDoc(doc(db, "system_settings", "config"), { blacklistedEmails: arrayUnion(newBlacklistEmail.trim()) }); setNewBlacklistEmail(''); triggerAlert("已新增至黑名單"); } catch (e) { triggerAlert("新增失敗"); } setIsSubmitting(false); };
            const handleRemoveBlacklist = async (email) => { triggerConfirm(`確定要解除封鎖 ${email} 嗎？`, async () => { try { await updateDoc(doc(db, "system_settings", "config"), { blacklistedEmails: arrayRemove(email) }); triggerAlert("已解除封鎖"); } catch (e) { } }); };

            const handleCreateClass = async (e) => {
                e.preventDefault(); const name = newClassName.trim(); if (!name) return;
                const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                try {
                    await updateDoc(doc(db, 'system_settings', 'classes'), { list: arrayUnion({ code, name, createdAt: new Date().toISOString() }) });
                    setNewClassName(''); triggerAlert(`成功建立班級：${name} (代碼: ${code})`);
                } catch(e) { 
                    await setDoc(doc(db, 'system_settings', 'classes'), { list: arrayUnion({ code, name, createdAt: new Date().toISOString() }) }, { merge: true });
                    setNewClassName(''); triggerAlert(`成功建立班級：${name} (代碼: ${code})`);
                }
            };

            const handleDeepDeleteClass = async (classObj) => {
                triggerConfirm(`⚠️ 警告：確定要刪除班級 ${classObj.name}？\n\n此操作將會：\n1. 刪除班級代碼\n2. 刪除該班級所有廣播功課\n3. 將所有學生踢出該班級\n\n(學生私有記錄將保留但變為孤兒記錄)`, async () => {
                    try {
                        const batch = writeBatch(db);
                        const tasksQ = query(collection(db, "public_assignments"), where("targetClass", "==", classObj.code));
                        const tasksSnap = await getDocs(tasksQ);
                        tasksSnap.forEach(d => batch.delete(d.ref));

                        const usersQ = query(collection(db, "users_public"), where("joinedClasses", "array-contains", classObj.code));
                        const usersSnap = await getDocs(usersQ);
                        usersSnap.forEach(d => batch.update(d.ref, { joinedClasses: arrayRemove(classObj.code) }));

                        const classesRef = doc(db, 'system_settings', 'classes');
                        const classesSnap = await getDoc(classesRef);
                        
                        if (classesSnap.exists()) {
                            const currentList = classesSnap.data().list || [];
                            const newList = currentList.filter(c => c.code !== classObj.code);
                            batch.update(classesRef, { list: newList });
                        }
                        
                        await batch.commit();
                        triggerAlert("班級已徹底刪除及清理");
                    } catch (e) { 
                        console.error(e);
                        triggerAlert("刪除過程發生錯誤：" + e.message); 
                    }
                });
            };

            const handleDeleteUser = async (targetUser) => {
                triggerConfirm(`⚠️ 危險操作！確定要刪除用戶 ${targetUser.displayName} (${targetUser.email}) 的所有資料？此操作無法復原！`, async () => {
                    try {
                        const batch = writeBatch(db);
                        const itemsQ = query(collection(db, "users", targetUser.uid, "items"));
                        const itemsSnap = await getDocs(itemsQ);
                        
                        itemsSnap.forEach(d => batch.delete(d.ref));
                        batch.delete(doc(db, "users", targetUser.uid, "settings", "timetable"));
                        batch.delete(doc(db, "users", targetUser.uid, "settings", "subjects"));
                        batch.delete(doc(db, "users_public", targetUser.uid));
                        
                        await batch.commit();
                        triggerAlert("用戶資料已徹底刪除");
                        if (selectedUser?.uid === targetUser.uid) setSelectedUser(null);
                    } catch (e) { triggerAlert("刪除失敗: " + e.message); }
                });
            };
            
            const handleUpdateUserName = async () => {
                if(!selectedUser || !newName.trim()) return;
                try {
                    await updateDoc(doc(db, "users_public", selectedUser.uid), { displayName: newName.trim() });
                    triggerAlert("用戶名稱已更新");
                } catch(e) { triggerAlert("更新失敗"); }
            };

            const handleAdminUpdateItem = async (itemId, updatedData) => {
                if (!selectedUser) return;
                try {
                    await updateDoc(doc(db, "users", selectedUser.uid, "items", itemId), updatedData);
                    triggerAlert("已修改該用戶紀錄");
                } catch(e) { triggerAlert("修改失敗: " + e.message); throw e; }
            };

            const handleAdminDeleteItem = async (itemId) => {
                if (!selectedUser) return;
                const targetItem = userHomeworks.find(i => i.id === itemId);
                if (!targetItem) return;

                triggerConfirm("確定要刪除此條紀錄嗎？", async () => {
                    try {
                        if (targetItem.publicRefId) { await updateDoc(doc(db, "users", selectedUser.uid, "items", itemId), { isHidden: true }); } 
                        else { await deleteDoc(doc(db, "users", selectedUser.uid, "items", itemId)); }
                    } catch(e) { triggerAlert("刪除失敗"); }
                });
            };

            const handleDeletePublicTask = (taskId) => {
                triggerConfirm("確定要撤回這份廣播功課嗎？這會同時從所有同學的清單中移除。", async () => {
                    try { 
                        const batch = writeBatch(db);
                        batch.delete(doc(db, "public_assignments", taskId));
                        
                        for (const u of users) {
                            const dupQ = query(collection(db, "users", u.uid, "items"), where("publicRefId", "==", taskId));
                            const snap = await getDocs(dupQ);
                            snap.forEach(d => batch.delete(d.ref));
                        }
                        
                        await batch.commit();
                        triggerAlert("廣播功課已撤回並同步清理所有學生紀錄"); 
                    } catch (e) { triggerAlert("撤回失敗: " + e.message); }
                });
            };

            const handleScanExpired = async () => {
                setIsScanning(true);
                const today = new Date(); today.setHours(0,0,0,0);
                const report = [];
                try {
                    for (const u of users) {
                        const q = query(collection(db, "users", u.uid, "items"));
                        const snap = await getDocs(q);
                        const userItems = snap.docs.map(d => d.data());
                        
                        const expired = userItems.filter(item => {
                            if (item.completed) return false; 
                            const due = new Date(item.dueDate); due.setHours(0,0,0,0);
                            return due < today; 
                        });

                        if (expired.length > 0) { report.push({ user: u, expiredCount: expired.length, items: expired }); }
                    }
                    setExpiredReport(report.sort((a,b) => b.expiredCount - a.expiredCount));
                    if (report.length === 0) triggerAlert("太棒了！所有學生都沒有未清理的過期功課。");
                } catch(e) { triggerAlert("掃描失敗: " + e.message); }
                setIsScanning(false);
            };
            
            const getUserStatus = (lastSeen) => {
                if (!lastSeen || typeof lastSeen.toDate !== 'function') return 'offline';
                const diff = new Date() - lastSeen.toDate();
                if (diff < 2 * 60 * 1000) return 'online';
                if (diff < 10 * 60 * 1000) return 'idle';
                return 'offline';
            };

            const activeTodayCount = users.filter(u => u.lastSeen && typeof u.lastSeen.toDate === 'function' && (new Date() - u.lastSeen.toDate()) < 24 * 60 * 60 * 1000).length;
            const filteredUsers = users.filter(u => (u.displayName || '').toLowerCase().includes(searchQuery.toLowerCase()) || (u.email || '').toLowerCase().includes(searchQuery.toLowerCase()));

            return (
                <div className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl shadow-lg border border-slate-100 overflow-hidden flex flex-col md:flex-row min-h-[700px] relative z-20">
                    <div className="w-full md:w-64 bg-slate-900 dark:bg-slate-950 text-slate-300 p-6 flex flex-col gap-2 shrink-0 border-r border-slate-800">
                        <div className="flex items-center gap-3 mb-8 text-white px-2">
                            <button onClick={onBack} className="p-2 -ml-2 hover:bg-slate-800 rounded-full transition-colors"><Icon name="x" className="w-5 h-5" /></button>
                            <h2 className="text-xl font-black tracking-wide">超級管理中心</h2>
                        </div>
                        <div className="flex flex-row md:flex-col gap-2 overflow-x-auto scrollbar-hide pb-2 md:pb-0">
                            {[ { id: 'overview', icon: 'check-circle-2', label: '系統概覽' }, { id: 'users', icon: 'school', label: '用戶數據管理' }, { id: 'classes', icon: 'school', label: '班級代碼管理' }, { id: 'tasks', icon: 'bell', label: '廣播任務中心' }, { id: 'settings', icon: 'book-open', label: '核心系統設定' } ].map(tab => (
                                <button key={tab.id} onClick={() => { setActiveTab(tab.id); setSelectedUser(null); }} className={`flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all whitespace-nowrap md:whitespace-normal ${activeTab === tab.id ? 'bg-indigo-600 text-white shadow-lg' : 'hover:bg-slate-800 hover:text-white'}`}>
                                    <Icon name={tab.icon} className={`w-5 h-5 ${activeTab === tab.id ? 'text-indigo-200' : 'text-slate-500'}`} /> {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 p-6 md:p-8 overflow-y-auto bg-slate-50/50 dark:bg-slate-900/50 text-slate-800 relative">
                        {editingAdminItem && (
                            <EditModal item={editingAdminItem} onClose={() => setEditingAdminItem(null)} onSave={handleAdminUpdateItem} triggerAlert={triggerAlert} subjects={subjects} />
                        )}

                        {activeTab === 'overview' && (
                            <div className="space-y-6 animate-fadeIn">
                                <h3 className="text-2xl font-bold dark:text-white mb-6">系統概覽</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div className="bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl p-6 text-white shadow-lg">
                                        <div className="text-blue-100 text-sm font-bold mb-1 flex items-center gap-2">總註冊用戶</div>
                                        <div className="text-4xl font-black">{users.length}</div>
                                    </div>
                                    <div className="bg-gradient-to-br from-emerald-400 to-teal-500 rounded-2xl p-6 text-white shadow-lg">
                                        <div className="text-emerald-100 text-sm font-bold mb-1 flex items-center gap-2">24小時內活躍</div>
                                        <div className="text-4xl font-black">{activeTodayCount}</div>
                                    </div>
                                    <div className="bg-gradient-to-br from-orange-400 to-red-500 rounded-2xl p-6 text-white shadow-lg">
                                        <div className="text-orange-100 text-sm font-bold mb-1 flex items-center gap-2">廣播任務總數</div>
                                        <div className="text-4xl font-black">{publicTasks.length}</div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'classes' && (
                            <div className="space-y-6 animate-fadeIn h-full flex flex-col">
                                <h3 className="text-2xl font-bold dark:text-white">班級代碼管理</h3>
                                <p className="text-sm text-slate-500 -mt-2">建立班級群組，系統會自動生成隨機代碼。學生憑代碼加入後，即可接收該班級專屬的廣播功課。</p>

                                <form onSubmit={handleCreateClass} className="flex gap-3 mt-4">
                                    <input type="text" placeholder="輸入班級名稱 (例如: 3A 班)..." value={newClassName} onChange={e => setNewClassName(e.target.value)} className="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all shadow-sm" required />
                                    <button type="submit" className="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition-all shadow-md active:scale-95 flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> 建立班級</button>
                                </form>

                                <div className="flex-1 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col mt-4">
                                    <div className="overflow-y-auto flex-1">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-50/80 text-slate-500 font-bold sticky top-0 backdrop-blur-md z-10 border-b border-slate-100">
                                                <tr><th className="px-6 py-4">班級名稱</th><th className="px-6 py-4">加入代碼 (6碼)</th><th className="px-6 py-4 text-right">操作</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-50">
                                                {systemClasses.map(c => (
                                                    <tr key={c.code} className="hover:bg-slate-50 transition-colors">
                                                        <td className="px-6 py-4 font-bold text-slate-800 flex items-center gap-2"><Icon name="school" className="w-4 h-4 text-indigo-500"/> {c.name}</td>
                                                        <td className="px-6 py-4"><span className="px-3 py-1 bg-slate-100 rounded-lg font-mono font-bold text-indigo-600 tracking-widest">{c.code}</span></td>
                                                        <td className="px-6 py-4 text-right"><button onClick={() => handleDeepDeleteClass(c)} className="p-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"><Icon name="trash2" className="w-4 h-4" /></button></td>
                                                    </tr>
                                                ))}
                                                {systemClasses.length === 0 && <tr><td colSpan="3" className="px-6 py-12 text-center text-slate-400">目前尚無任何班級</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'users' && !selectedUser && (
                            <div className="space-y-6 animate-fadeIn h-full flex flex-col">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <h3 className="text-2xl font-bold dark:text-white">用戶數據管理</h3>
                                    <div className="flex gap-2 w-full sm:w-auto flex-col sm:flex-row">
                                        <button onClick={handleScanExpired} disabled={isScanning} className="bg-orange-500 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm hover:bg-orange-600 flex items-center justify-center gap-2 disabled:opacity-50">
                                            {isScanning ? <Icon name="loader" className="w-4 h-4 animate-spin" /> : '掃描未清過期'}
                                        </button>
                                        <div className="relative w-full sm:w-auto flex-1">
                                            <input type="text" placeholder="搜尋用戶名字或 Email..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full px-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none shadow-sm" />
                                        </div>
                                    </div>
                                </div>

                                {expiredReport && (
                                    <div className="p-4 bg-orange-50 border border-orange-200 rounded-2xl animate-fadeIn shrink-0">
                                        <div className="flex justify-between items-center mb-3">
                                            <h4 className="font-bold text-orange-800 flex items-center gap-2"><Icon name="alert-circle" className="w-5 h-5"/> 未清理過期功課的學生名單 ({expiredReport.length} 人)</h4>
                                            <button onClick={() => setExpiredReport(null)} className="text-orange-500"><Icon name="x" className="w-5 h-5"/></button>
                                        </div>
                                        <div className="max-h-40 overflow-y-auto space-y-2 pr-2 scrollbar-hide">
                                            {expiredReport.map(r => (
                                                <div key={r.user.uid} className="flex justify-between items-center bg-white p-3 rounded-xl border border-orange-100 cursor-pointer shadow-sm" onClick={() => setSelectedUser(r.user)}>
                                                    <span className="font-bold text-sm flex items-center gap-2">
                                                        <div className="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-xs">{r.user.displayName?.[0]?.toUpperCase() || 'U'}</div>
                                                        {r.user.displayName} <span className="text-xs text-slate-400 font-normal hidden sm:inline-block ml-1">{r.user.email}</span>
                                                    </span>
                                                    <span className="bg-red-100 text-red-600 px-3 py-1 rounded-lg font-bold text-xs">{r.expiredCount} 項未清</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="flex-1 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden flex flex-col">
                                    <div className="overflow-y-auto flex-1">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-slate-50/80 text-slate-500 font-bold sticky top-0 backdrop-blur-md z-10 border-b border-slate-100">
                                                <tr><th className="px-6 py-4">用戶資訊</th><th className="px-6 py-4">身分權限</th><th className="px-6 py-4">最後上線</th></tr>
                                            </thead>

                    if (item.isHidden) return false; 
                    const due = new Date(item.dueDate); due.setHours(0,0,0,0);
                    return Math.floor((today - due) / 86400000) >= 2; 
                });

                if (toDelete.length > 0) {
                    autoDeleteRan.current = true; const batch = writeBatch(db);
                    toDelete.forEach(item => { if (item.publicRefId) batch.update(doc(db, "users", user.uid, "items", item.id), { isHidden: true }); else batch.delete(doc(db, "users", user.uid, "items", item.id)); });
                    batch.commit().catch(e => console.warn("Auto delete failed", e));
                } else { autoDeleteRan.current = true; }
            }, [user, items, db]);

            useEffect(() => {
                const currentClasses = joinedClassesStr ? joinedClassesStr.split(',') : [];
                if (currentClasses.length > 0 && !selectedClassBoard) setSelectedClassBoard(currentClasses[0]);
                else if (currentClasses.length === 0) setSelectedClassBoard(null);
            }, [joinedClassesStr, selectedClassBoard]);

            useEffect(() => {
                if (!user || !db) return;
                const q = query(collection(db, "public_assignments"), orderBy("createdAt", "desc"));
                const unsubscribe = onSnapshot(q, async (snapshot) => { 
                    try {
                        setPublicTasks(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                        const currentClasses = joinedClassesStr ? joinedClassesStr.split(',') : [];
                        const existingItems = itemsRef.current;
                        const existingPublicIds = new Set(existingItems.map(i => i.publicRefId).filter(Boolean));

                        const addPromises = []; const batch = writeBatch(db); let hasBatchOp = false;

                        for (const change of snapshot.docChanges()) { 
                            try {
                                const publicData = change.doc.data(); const publicId = change.doc.id; 
                                const target = publicData.targetClass || '全校';
                                const isForMe = target === '全校' || currentClasses.includes(target); 

                                if (change.type === "added" && isForMe && !existingPublicIds.has(publicId)) { 
                                    addPromises.push(addDoc(collection(db, "users", user.uid, "items"), { ...publicData, publicRefId: publicId, completed: false, forceExpired: publicData.forceExpired || false })); 
                                    const createdTime = publicData.createdAt ? new Date(publicData.createdAt).getTime() : 0;
                                    if (createdTime > pageLoadTime) triggerAlert(`收到新廣播功課：${publicData.subject}`); 
                                } 
                                if (change.type === "removed") { 
                                    const toDelete = existingItems.filter(i => i.publicRefId === publicId);
                                    toDelete.forEach(item => { batch.delete(doc(db, "users", user.uid, "items", item.id)); hasBatchOp = true; });
                                } 
                                if (change.type === "modified") { 
                                    const toUpdate = existingItems.filter(i => i.publicRefId === publicId);
                                    toUpdate.forEach(item => { batch.update(doc(db, "users", user.uid, "items", item.id), { forceExpired: publicData.forceExpired === true }); hasBatchOp = true; });
                                } 
                            } catch (e) { console.warn("Task process err:", e); }
                        }
                        if (addPromises.length > 0) await Promise.all(addPromises);
                        if (hasBatchOp) await batch.commit();

                    } catch (e) { console.warn("Public tasks wrapper err:", e); }
                }, (err) => console.warn("Public tasks err:", err)); 
                return () => unsubscribe(); 
            }, [user, db, joinedClassesStr, pageLoadTime, isAdmin]);

                const tomorrowStr = `${tomorrow.getFullYear()}-${String(tomorrow.getMonth() + 1).padStart(2, '0')}-${String(tomorrow.getDate()).padStart(2, '0')}`;
