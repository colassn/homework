                                                    <button type="button" onClick={()=>setInputType('homework')} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${inputType === 'homework' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>功課</button>
                                                    <button type="button" onClick={()=>setInputType('assessment')} className={`flex-1 sm:flex-none px-6 py-2.5 rounded-xl text-sm font-bold transition-all ${inputType === 'assessment' ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>測驗</button>
                                                </div>
                                                {isAdmin && (
                                                    <label className={`w-full sm:w-auto flex items-center justify-between sm:justify-start cursor-pointer gap-4 px-4 py-2.5 rounded-2xl border-2 transition-all ${isBroadcast ? 'bg-orange-50 border-orange-300' : 'bg-slate-50 border-slate-100 hover:border-slate-300'}`}>
                                                        <div className="flex items-center gap-2.5"><Icon name="bell" className={`w-5 h-5 ${isBroadcast ? 'text-orange-500 animate-pulse' : 'text-slate-400'}`} /><span className={`text-sm font-bold ${isBroadcast ? 'text-orange-700' : 'text-slate-500'}`}>全校廣播發佈</span></div>
                                                        <div className="relative"><input type="checkbox" className="sr-only peer" checked={isBroadcast} onChange={e => setIsBroadcast(e.target.checked)} /><div className="w-12 h-7 bg-slate-200 rounded-full peer peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-orange-500"></div></div>
                                                    </label>
                                                )}
                                            </div>

                                            <div className="relative -mx-2 px-2 mt-2">
                                                <div className="flex gap-2.5 overflow-x-auto scrollbar-hide pb-4 pt-2 snap-x snap-mandatory">
                                                    {subjects.map(sub => {
                                                        const isSelected = subject === sub.name;
                                                        return ( <button key={sub.name} type="button" onClick={() => setSubject(sub.name)} className={`snap-start shrink-0 px-5 py-2.5 rounded-2xl text-sm font-black transition-all flex items-center justify-center min-w-[80px] border-2 ${isSelected ? `${sub.color} shadow-sm -translate-y-1 border-transparent` : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100 hover:-translate-y-0.5'}`}>{sub.name}</button> );
                                                    })}
                                                </div>
                                            </div>

                                            <div className="bg-slate-50/60 rounded-[1.5rem] border border-slate-200/60 p-2 sm:p-3 transition-all focus-within:bg-white focus-within:border-indigo-300">
                                                <input type="text" placeholder={inputType === 'homework' ? "輸入功課細節 (例如: 中文作句 P.4-5)..." : "輸入測驗/大考範圍..."} value={description} onChange={(e) => setDescription(e.target.value)} className="w-full bg-transparent px-4 py-3 sm:py-4 text-lg sm:text-xl font-bold text-slate-800 outline-none placeholder:text-slate-400 placeholder:font-medium" autoComplete="off" />
                                                <div className="flex flex-wrap sm:flex-nowrap justify-between items-center gap-3 mt-2 pt-3 border-t border-slate-200/60 px-2 pb-1">
                                                    <div className="flex items-center gap-2.5 overflow-x-auto scrollbar-hide py-1 flex-1">
                                                        <div className="relative group cursor-pointer shrink-0">
                                                            <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" required />
                                                            <div className={`flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold transition-all border ${dueDate ? t.bg + ' text-white shadow-sm border-transparent' : 'bg-white text-slate-500 border-slate-200 group-hover:border-indigo-400'}`}>
                                                                <Icon name="calendar-clock" className="w-4 h-4" /><span>{dueDate ? formatDueDate(dueDate) : '選擇交期'}</span>
                                                            </div>
                                                        </div>
                                                        <button type="button" onClick={() => { const d = new Date(); d.setDate(d.getDate() + 1); setDueDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`); }} className="shrink-0 px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-600 text-sm font-bold hover:bg-slate-50 transition-all shadow-sm active:scale-95 flex items-center gap-1.5"><Icon name="check-circle-2" className="w-4 h-4 text-orange-500" />聽日</button>
                                                    </div>
                                                    <button type="submit" disabled={!description.trim() || !dueDate} className={`shrink-0 w-12 h-12 sm:w-14 sm:h-14 rounded-full text-white flex items-center justify-center transition-all ${(!description.trim() || !dueDate) ? 'bg-slate-300 opacity-60 cursor-not-allowed scale-95' : `${t.bg} hover:scale-110 active:scale-90 shadow-lg`}`}>
                                                        <Icon name="check-circle" className="w-5 h-5 sm:w-6 sm:h-6" />
                                                    </button>
                                                </div>
                                            </div>
                                        </form>
                                    )}

                                    {isVisible('list') && (
                                        <>
                                            <div className="flex flex-col sm:flex-row justify-between items-center gap-3 mb-6 relative">
                                                <div className={`flex items-center gap-2 w-full sm:w-auto overflow-x-auto scrollbar-hide pb-1 transition-opacity ${!isListVisible ? 'opacity-50' : 'opacity-100'}`}>
                                                    <span className="text-slate-400 text-xs font-bold whitespace-nowrap">篩選:</span>
                                                    <button onClick={() => handleFilterChange('全部')} className={`flex-shrink-0 px-2.5 py-1 rounded text-[10px] font-bold border transition-all ${filterSubject === '全部' ? 'bg-slate-800 text-white border-slate-800' : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>全部</button>
                                                    {subjects.map(sub => ( <button key={sub.name} onClick={() => handleFilterChange(sub.name)} className={`flex-shrink-0 px-2.5 py-1 rounded text-[10px] font-bold border transition-all ${filterSubject === sub.name ? `${t.border} ${t.lightBg} ${t.text}` : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'}`}>{sub.name}</button> ))}
                                                </div>
                                                <div className="flex items-center gap-2 w-full sm:w-auto z-30">
                                                    {viewMode !== 'history' ? ( <button onClick={handleClearExpired} className="flex-shrink-0 text-xs font-bold bg-red-50 text-red-600 px-3 py-1.5 rounded-lg hover:bg-red-100 flex items-center gap-1"><Icon name="trash2" className="w-3 h-3" /> 清理過期</button> ) : ( <button onClick={handleClearHistory} className="flex-shrink-0 text-xs font-bold bg-slate-100 text-slate-600 px-3 py-1.5 rounded-lg hover:bg-slate-200 flex items-center gap-1"><Icon name="trash2" className="w-3 h-3" /> 清理歷史</button> )}
                                                    <span className="text-slate-400 text-xs font-bold whitespace-nowrap ml-1">排序:</span>
                                                    <CustomDropdown value={sortOption} onChange={handleSortChange} options={[{ value: 'date_asc', label: '日期 (趕急先)' }, { value: 'date_desc', label: '日期 (長遠先)' }]} />
                                                </div>
                                            </div>

                                            <div className={`space-y-4 pb-10 transition-opacity ${!isListVisible ? 'opacity-0' : 'opacity-100'}`}>
                                                {displayedItems.length === 0 ? (
                                                    <div className="text-center py-20"><div className={`inline-flex p-6 rounded-full ${t.lightBg} mb-4`}><Icon name="check-circle-2" className={`w-12 h-12 ${t.text}`} /></div><h3 className="text-xl font-bold text-slate-700">{viewMode === 'history' ? '沒有已完成的紀錄' : '太好了！任務清單空空如也'}</h3></div>
                                                ) : viewLayout === 'table' && viewMode !== 'history' ? (
                                                    <div className="bg-white/80 backdrop-blur-xl rounded-3xl shadow-sm border border-white/50 overflow-hidden animate-fadeIn p-2 sm:p-4">
                                                        <div className="overflow-x-auto rounded-2xl border border-slate-100 bg-white">
                                                            <table className="w-full text-left text-sm border-collapse">
                                                                <thead className="bg-slate-50/80 text-slate-500 font-bold text-[11px] uppercase tracking-widest border-b border-slate-100">
                                                                    <tr><th className="px-5 py-4 whitespace-nowrap">狀態 / 科目</th><th className="px-5 py-4 min-w-[200px]">功課內容</th><th className="px-5 py-4 whitespace-nowrap">幾時交 (Due Date)</th><th className="px-5 py-4 text-right whitespace-nowrap">操作</th></tr>
                                                                </thead>
                                                                <tbody className="divide-y divide-slate-100">
                                                                    {displayedItems.map((item, index) => {
                                                                        const isExiting = exitingIds.includes(item.id); const isCompleted = item.completed || isExiting; const dl = getDaysRemaining(item.dueDate);
                                                                        let statusColor = "text-emerald-600"; let statusDot = "bg-emerald-500 shadow-sm"; let statusText = `${dl} 天後`;
                                                                        if(dl < 0) { statusColor = "text-red-500"; statusDot = "bg-red-500 shadow-sm"; statusText = `已過期`; }
                                                                        if(dl === 0) { statusColor = "text-orange-500"; statusDot = "bg-orange-500 shadow-sm animate-pulse"; statusText = "今日到期"; }
                                                                        if(isCompleted) { statusColor = "text-slate-400"; statusDot = "bg-slate-300 shadow-none"; statusText = "已完成"; }
                                                                        const subjectStyle = subjects.find(s => s.name === item.subject)?.color || 'bg-slate-100 text-slate-600 border-slate-200';
                                                                        return (
                                                                            <tr key={item.id} style={{ animationDelay: `${index * 0.05}s` }} className={`animate-item hover:bg-slate-50/80 transition-all group ${isCompleted ? 'opacity-50 grayscale' : ''} ${isExiting ? 'scale-y-0 opacity-0' : ''}`}>
                                                                                <td className="px-5 py-4 whitespace-nowrap"><div className="flex items-center gap-3"><div className={`w-2.5 h-2.5 rounded-full ${statusDot}`}></div><span className={`text-[11px] font-bold px-2.5 py-1 rounded-lg border shadow-sm ${subjectStyle}`}>{item.subject || '其他'}</span></div><div className={`text-[11px] font-bold mt-2 ml-5 flex items-center gap-1.5 ${statusColor}`}>{statusText}</div></td>
                                                                                <td className="px-5 py-4"><div className={`text-base font-bold transition-colors group-hover:text-indigo-600 ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}`}>{item.description}</div><div className="flex gap-2 mt-2">{item.publicRefId && <span className={`inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-md ${t.lightBg} ${t.text}`}>廣播任務</span>}</div></td>
                                                                                <td className="px-5 py-4 whitespace-nowrap"><div className="font-mono text-sm font-bold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-lg inline-flex items-center gap-2 border border-slate-200">{formatDueDate(item.dueDate)}</div></td>
                                                                                <td className="px-5 py-4 text-right whitespace-nowrap"><div className="flex items-center justify-end gap-2 opacity-90 group-hover:opacity-100"><button onClick={() => handleToggle(item.id, item.completed)} className={`w-8 h-8 rounded-full border-2 flex items-center justify-center transition-all hover:scale-110 active:scale-95 ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white shadow-sm' : 'border-slate-300 hover:border-emerald-400 bg-white/50'}`}><Icon name="check-circle" className={`w-4 h-4 ${isCompleted ? 'opacity-100' : 'opacity-0 text-emerald-500 group-hover:opacity-40 transition-opacity'}`} /></button>{!item.forceExpired && <button onClick={() => setEditingItem(item)} className="p-2 text-slate-400 hover:text-blue-500 transition hover:bg-blue-50 rounded-xl hover:scale-105"><Icon name="book-open" className="w-4 h-4" /></button>}<button onClick={() => deleteItem(item.id)} className="p-2 text-slate-400 hover:text-red-500 transition hover:bg-red-50 rounded-xl hover:scale-105"><Icon name="trash2" className="w-4 h-4" /></button></div></td>
                                                                            </tr>
                                                                        );
                                                                    })}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                    </div>
                                                ) : displayedItems.map((item, index) => {
                                                    const isExiting = exitingIds.includes(item.id); const isCompleted = item.completed || isExiting; const dl = getDaysRemaining(item.dueDate);
                                                    let statusColor = "text-emerald-500"; let statusText = `${dl} 天後`;
                                                    if(dl < 0) { statusColor = "text-red-500"; statusText = `已過期`; } if(dl === 0) { statusColor = "text-orange-500 animate-pulse"; statusText = "今日到期"; } if(isCompleted) { statusColor = "text-slate-400"; statusText = "已完成"; }
                                                    const subjectStyle = subjects.find(s => s.name === item.subject)?.color || 'bg-slate-100 text-slate-600 border-slate-200';
                                                    return (
                                                        <div key={item.id} style={{ animationDelay: `${index * 0.05}s` }} className={`animate-item bg-white rounded-3xl p-5 shadow-sm border border-slate-100 transition-all hover:shadow-md hover:-translate-y-0.5 group ${isExiting ? 'scale-95 opacity-0' : ''}`}>
                                                            <div className="flex items-start gap-4">
                                                                <button onClick={() => handleToggle(item.id, item.completed)} className={`mt-0.5 w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 transition-all ${isCompleted ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-200 bg-slate-50/50 hover:border-emerald-400'}`}><Icon name="check-circle" className={`w-4 h-4 ${isCompleted ? 'opacity-100' : 'opacity-0'}`} /></button>
                                                                <div className="flex-1 min-w-0">
                                                                    <div className="flex justify-between items-start mb-1.5"><div className="flex gap-2 items-center flex-wrap"><span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg border ${subjectStyle}`}>{item.subject || '其他'}</span>{item.publicRefId && <span className={`text-[10px] font-bold px-2 py-0.5 rounded-lg ${t.lightBg} ${t.text}`}>廣播</span>}</div><div className={`text-[11px] font-bold flex items-center gap-1 ${statusColor}`}>{statusText}</div></div>
                                                                    <div className={`text-base sm:text-lg font-bold mb-2 break-words ${isCompleted ? 'line-through text-slate-400' : 'text-slate-800'}`}>{item.description}</div>
                                                                    <div className="flex items-center justify-between mt-3 pt-3 border-t border-slate-50">
                                                                        <div className="text-xs text-slate-400 flex items-center gap-1 font-medium">{formatDueDate(item.dueDate)}</div>
                                                                        <div className="flex gap-2 opacity-40 group-hover:opacity-100 transition-opacity duration-300">
                                                                            {!item.forceExpired && <button onClick={() => setEditingItem(item)} className="p-1 text-slate-500 hover:text-blue-500 transition"><Icon name="book-open" className="w-4 h-4" /></button>}
                                                                            {isAdmin && item.publicRefId ? ( <><button onClick={() => deleteItem(item.id)} className="p-1 text-slate-500 hover:text-red-500 transition"><Icon name="trash2" className="w-4 h-4" /></button><button onClick={() => deletePublicItem(item.publicRefId, item.id)} className="p-1 text-slate-500 hover:text-indigo-600 transition"><Icon name="bell" className="w-4 h-4" /></button></> ) : ( <button onClick={() => deleteItem(item.id)} className="p-1 text-slate-500 hover:text-red-500 transition"><Icon name="trash2" className="w-4 h-4" /></button> )}
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </>
                                    )}
                                </>
                            )}

                            {viewMode === 'current' && appMode === 'class' && (
                                <div className="space-y-6 animate-fadeIn pb-10">
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex justify-between items-center">
                                        <div><h3 className="text-xl font-bold flex items-center gap-2"><Icon name="school" className={t.text} /> 我的班級</h3><p className="text-sm text-slate-500 mt-1">查看專屬的廣播任務</p></div>
                                        <button onClick={() => setIsJoinClassOpen(true)} className={`px-4 py-2.5 rounded-xl font-bold text-sm text-white shadow-md active:scale-95 transition-all flex items-center gap-2 ${t.bg}`}><Icon name="plus" className="w-4 h-4" /> 加入班級</button>
                                    </div>

                                    {joinedClasses.length === 0 ? (
                                        <div className="text-center py-20 bg-white rounded-3xl border border-dashed border-slate-200">
                                            <Icon name="school" className="w-16 h-16 mx-auto text-slate-300 mb-4" />
                                            <h4 className="text-lg font-bold text-slate-600 mb-2">尚未加入任何班級</h4>
                                            <p className="text-sm text-slate-400 mb-6">請向老師索取 6 位數班級代碼</p>
                                            <button onClick={() => setIsJoinClassOpen(true)} className={`px-8 py-3 rounded-xl font-bold text-sm text-white shadow-md transition-all active:scale-95 ${t.bg}`}>立即加入</button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                                {joinedClasses.map(code => {
                                                    const cls = systemClasses.find(c => c.code === code); const name = cls ? cls.name : code;
                                                    return ( <button key={code} onClick={() => setSelectedClassBoard(code)} className={`shrink-0 px-5 py-2.5 rounded-xl text-sm font-bold border-2 transition-all ${selectedClassBoard === code ? `${t.border} ${t.lightBg} ${t.text}` : 'bg-white text-slate-500 border-slate-100'}`}>{name}</button> )
                                                })}
                                            </div>
                                            <div className="space-y-4">
                                                {publicTasks.filter(task => task.targetClass === selectedClassBoard).length === 0 ? (
                                                    <div className="text-center py-10"><p className="text-slate-500 font-medium">此班級目前沒有廣播任務 🎉</p></div>
                                                ) : publicTasks.filter(task => task.targetClass === selectedClassBoard).map((task, idx) => {
                                                    const subjectStyle = subjects.find(s => s.name === task.subject)?.color || 'bg-slate-100 text-slate-600 border-slate-200';
                                                    return (
                                                    <div key={task.id} style={{ animationDelay: `${idx * 0.05}s` }} className="animate-item bg-white/80 backdrop-blur-xl p-5 rounded-2xl shadow-sm border border-white/50 relative overflow-hidden transition-all hover:-translate-y-1 hover:shadow-lg group">
                                                        {task.forceExpired && <div className="absolute inset-0 bg-white/50 backdrop-blur-[1px] z-20 flex items-center justify-center pointer-events-none"><span className="bg-red-500 text-white font-bold px-4 py-2 rounded-xl shadow-lg rotate-[-10deg]">已強制過期</span></div>}
                                                        <div className="relative z-10">
                                                            <div className="flex justify-between items-start mb-3"><div className="flex gap-2 items-center"><span className={`text-[10px] font-bold px-2.5 py-1 rounded border ${subjectStyle}`}>{task.subject}</span><span className="text-[10px] bg-slate-100 text-slate-500 px-2 py-1 rounded font-bold">{task.type === 'homework' ? '功課' : '測驗'}</span></div><span className="text-xs text-slate-400 font-mono font-bold bg-slate-50 px-2 py-1 rounded border border-slate-100">Due: {formatDueDate(task.dueDate)}</span></div>
                                                            <p className="font-bold text-lg text-slate-800 mb-3 break-words">{task.description}</p>
                                                            <div className="text-xs text-slate-400 flex justify-between items-center border-t border-slate-50 pt-3"><span className="flex items-center gap-1">發佈人: {task.senderName || '老師'}</span><span>{new Date(task.createdAt).toLocaleString('zh-HK')}</span></div>
                                                        </div>
                                                    </div>
                                                    )})}
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}
                        </div>
                        )}
                    </div>

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-white/90 dark:bg-slate-900/90 backdrop-blur-2xl rounded-full p-2 shadow-lg border border-white/50 z-[100] flex items-center justify-between gap-1 sm:gap-2 max-w-[95%] overflow-x-auto dynamic-island-scroll">
                        <NavItem icon="book-open" label="主頁" active={viewMode === 'current' && appMode === 'personal'} onClick={() => { setViewMode('current'); setAppMode('personal'); }} t={t} />
                        <NavItem icon="school" label="班級" active={viewMode === 'current' && appMode === 'class'} onClick={() => { setViewMode('current'); setAppMode('class'); }} t={t} />
                        <NavItem icon="calendar-clock" label="時間表" active={viewMode === 'timetable' || viewMode === 'timetable_edit'} onClick={() => setViewMode('timetable')} t={t} />
                        <NavItem icon="timer" label="歷史" active={viewMode === 'history'} onClick={() => setViewMode('history')} t={t} />
                        {isAdmin && ( <><div className="w-px h-6 bg-slate-200 mx-1"></div><NavItem icon="check-circle-2" label="後台" active={viewMode === 'admin'} onClick={() => setViewMode('admin')} t={t} /></> )}
                    </div>

                    {editingItem && <EditModal item={editingItem} onClose={() => setEditingItem(null)} onSave={handleUpdateItem} triggerAlert={triggerAlert} subjects={subjects} />}
                    {quickView.isOpen && <QuickViewModal isOpen={quickView.isOpen} onClose={() => setQuickView({ isOpen: false, title: '', items: [] })} title={quickView.title} items={quickView.items} subjects={subjects} onEdit={setEditingItem} onDelete={deleteItem} isAdmin={isAdmin} userUid={user?.uid} />}
                    {isPreferencesOpen && <AppearanceModal isOpen={isPreferencesOpen} onClose={() => setIsPreferencesOpen(false)} t={t} themeColor={themeColor} setThemeColor={setThemeColor} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} layoutMode={layoutMode} setLayoutMode={setLayoutMode} customLayout={customLayout} setCustomLayout={setCustomLayout} />}
                    {showNameSetup && <NameSetupModal user={user} onSave={handleNameSetupSave} loading={nameSetupLoading} triggerAlert={triggerAlert} t={t} />}
                    <JoinClassModal isOpen={isJoinClassOpen} onClose={() => setIsJoinClassOpen(false)} systemClasses={systemClasses} joinedClasses={joinedClasses} onJoin={handleJoinClassSubmit} t={t} />
                    {isSubjectManagerOpen && <SubjectManagerModal isOpen={isSubjectManagerOpen} onClose={() => setIsSubjectManagerOpen(false)} currentSubjects={subjects} onSave={saveSubjects} triggerConfirm={triggerConfirm} />}

                    <div className={`fixed bottom-24 sm:bottom-10 left-1/2 transform -translate-x-1/2 z-[200] transition-all duration-300 ${toast.isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10 pointer-events-none'}`}>
                        <div className={`px-6 py-3 rounded-full font-bold text-sm shadow-xl flex items-center gap-2 whitespace-nowrap ${toast.type === 'error' ? 'bg-red-500 text-white' : 'bg-slate-800 text-white'}`}><Icon name={toast.type === 'error' ? 'alert-circle' : 'check-circle'} className="w-4 h-4" />{toast.message}</div>
                    </div>

                    {notification.isOpen && (
                        <div className="fixed inset-0 z-[250] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" onClick={closeNotification}></div>
                            <div className="dialog-animate bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 relative z-10 text-center border border-slate-100">
                                <div className="w-16 h-16 bg-amber-100 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="alert-circle" className="w-8 h-8" /></div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">請確認</h3>
                                <p className="text-slate-500 mb-6 text-sm">{notification.message}</p>
                                <div className="flex gap-3">
                                    <button onClick={closeNotification} className="flex-1 py-3 rounded-xl font-bold bg-slate-100 hover:bg-slate-200 text-slate-600 transition-colors">取消</button>
                                    <button onClick={handleNotificationConfirm} className="flex-1 py-3 rounded-xl font-bold bg-red-500 hover:bg-red-600 text-white transition-colors shadow-lg">確定</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
